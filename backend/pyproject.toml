[project]
name = "smet-erp-backend"
version = "0.3.0"
description = "SMET Battery Operations ERP - backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.32",
    "segno>=1.6.6",
    "sqlalchemy>=2",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
extend-exclude = ["migrations/versions"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101", "E501"]  # asserts are fine in tests; ruff format owns line length

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107"]  # fixed test passwords are fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
